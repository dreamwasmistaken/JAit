<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Future UI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:#050b14;
color:white;
}

/* Animated Background */

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,#00e5ff40,transparent 30%),
radial-gradient(circle at 80% 30%,#7c3aed50,transparent 35%),
radial-gradient(circle at 50% 80%,#06b6d450,transparent 35%),
linear-gradient(135deg,#020617,#071c2b,#0b3b4e);
background-size:200% 200%;
animation:bgMove 15s infinite alternate ease-in-out;
}

@keyframes bgMove{
0%{background-position:0% 50%}
100%{background-position:100% 50%}
}

/* Aurora */

.aurora{
position:absolute;
width:100%;
height:100%;
filter:blur(120px);
opacity:.6;
background:
linear-gradient(
90deg,
transparent,
#00f5ff55,
#8b5cf655,
#00f5ff55,
transparent
);
animation:aurora 10s linear infinite;
}

@keyframes aurora{
from{transform:translateX(-50%)}
to{transform:translateX(50%)}
}

/* Mouse Glow */

.cursor{
position:fixed;
width:300px;
height:300px;
border-radius:50%;
background:#00e5ff20;
pointer-events:none;
filter:blur(80px);
transform:translate(-50%,-50%);
}

/* Navbar */

nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:1200px;

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 30px;

background:rgba(255,255,255,.06);
backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.1);

border-radius:25px;
z-index:10;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
}

/* Hero */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
z-index:5;
position:relative;
}

h1{
font-size:8vw;
font-weight:900;
line-height:.9;
letter-spacing:-5px;
background:linear-gradient(
90deg,
#fff,
#a5f3fc,
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:shine 4s infinite linear;
background-size:300% auto;
}

@keyframes shine{
to{
background-position:300% center;
}
}

p{
margin-top:20px;
font-size:1.2rem;
opacity:.8;
}

/* Glass Card */

.card{
margin-top:50px;

width:420px;
max-width:90%;

padding:30px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.1);

border-radius:30px;

transition:.2s;
transform-style:preserve-3d;
}

.card:hover{
box-shadow:
0 0 80px rgba(0,229,255,.3);
}

/* Button */

button{
margin-top:25px;

padding:15px 30px;

border:none;

border-radius:20px;

font-weight:700;

cursor:pointer;

background:white;
color:#0f172a;
}

/* Floating Particles */

.particle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:.5;
animation:float linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-100px);
}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="aurora"></div>
<div class="cursor"></div>

<nav>
<div>FUTURE</div>
<div>
<a href="#">Work</a>
<a href="#">About</a>
<a href="#">Contact</a>
</div>
</nav>

<section class="hero">

<h1>FASHION<br>WEEK</h1>

<p>
Luxury glassmorphism meets futuristic motion design.
</p>

<div class="card" id="card">
<h2>The Future of Design</h2>
<p style="margin-top:15px">
Interactive. Animated. Premium.
</p>

<button>Explore</button>
</div>

</section>

<script>

/* Mouse Glow */

const cursor=document.querySelector(".cursor");

document.addEventListener("mousemove",(e)=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

/* 3D Tilt Card */

const card=document.getElementById("card");

document.addEventListener("mousemove",(e)=>{

const x=(window.innerWidth/2-e.clientX)/30;
const y=(window.innerHeight/2-e.clientY)/30;

card.style.transform=
`rotateY(${-x}deg) rotateX(${y}deg)`;
});

/* Particles */

for(let i=0;i<100;i++){

const p=document.createElement("div");

p.className="particle";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=
(5+Math.random()*10)+"s";

p.style.opacity=Math.random();

document.body.appendChild(p);
}
</script>

</body>
</html>
